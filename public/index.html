<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Password Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-6">
    <div class="w-full max-w-4xl glass-panel rounded-2xl p-8 shadow-2xl">
        <div class="flex items-center gap-3 mb-8 border-b border-slate-700/50 pb-4">
            <i data-lucide="shield-check" class="text-indigo-400 w-8 h-8"></i>
            <h1 class="text-2xl font-bold tracking-wide text-white">Password Saver Dashboard</h1>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <div class="space-y-4">
                <h2 class="text-lg font-semibold text-indigo-300 flex items-center gap-2">
                    <i data-lucide="lock" class="w-4 h-4"></i> Encrypt & Store
                </h2>
                <input id="storePath" type="text" placeholder="Application Path (e.g., prod/db)" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
                <input id="storeKey" type="text" placeholder="Key Identifier (e.g., root_pass)" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
                <input id="storeValue" type="password" placeholder="Password Value" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
                <button onclick="storeSecret()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium p-3 rounded-lg transition-colors shadow-lg shadow-indigo-600/20">Commit to Vault</button>
            </div>

            <div class="space-y-4 border-t md:border-t-0 md:border-l border-slate-700/50 pt-6 md:pt-0 md:pl-8">
                <h2 class="text-lg font-semibold text-emerald-300 flex items-center gap-2">
                    <i data-lucide="unlock" class="w-4 h-4"></i> Decrypt & Retrieve
                </h2>
                <input id="getPath" type="text" placeholder="Application Path" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-emerald-500 transition-colors">
                <input id="getKey" type="text" placeholder="Key Identifier" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-emerald-500 transition-colors">
                <button onclick="getSecret()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium p-3 rounded-lg transition-colors shadow-lg shadow-emerald-600/20">Fetch Password</button>
                
                <div id="resultPanel" class="hidden p-4 rounded-lg bg-slate-900/80 border border-emerald-500/30 text-emerald-400 font-mono break-all mt-4">
                    <span class="text-slate-400 text-xs block mb-1">DECRYPTED OUTPUT:</span>
                    <span id="secretOutput"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function storeSecret() {
            const body = {
                path: document.getElementById('storePath').value,
                key: document.getElementById('storeKey').value,
                value: document.getElementById('storeValue').value
            };
            const res = await fetch('/api/secrets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        async function getSecret() {
            const path = document.getElementById('getPath').value;
            const key = document.getElementById('getKey').value;
            const panel = document.getElementById('resultPanel');
            const output = document.getElementById('secretOutput');

            // Encode path parts safely
            const res = await fetch(`/api/secrets/${encodeURIComponent(path)}/${encodeURIComponent(key)}`);
            const data = await res.json();
            
            if(data.success) {
                panel.classList.remove('hidden');
                output.textContent = data.value;
            } else {
                alert(data.error);
            }
        }
    </script>
</body>
</html>
