<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AetherVault — Starting…</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #090d16 0%, #111126 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: #94a3b8;
            user-select: none;
            -webkit-app-region: drag;
        }
        .logo {
            width: 72px; height: 72px;
            border-radius: 20px;
            background: rgba(99,102,241,0.12);
            border: 1px solid rgba(99,102,241,0.25);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 24px;
            animation: pulse 2s ease-in-out infinite;
        }
        .logo svg { width: 36px; height: 36px; color: #818cf8; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.3); }
            50%       { box-shadow: 0 0 0 14px rgba(99,102,241,0); }
        }
        h1 { font-size: 18px; font-weight: 700; color: #e2e8f0;
             letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 8px; }
        p  { font-size: 11px; font-family: monospace; color: #475569;
             letter-spacing: 0.1em; }
        .dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
    </style>
</head>
<body>
    <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
    </div>
    <h1>AetherVault</h1>
    <p>Initializing secure vault engine<span class="dots">
        <span>.</span><span>.</span><span>.</span>
    </span></p>
</body>
</html>
